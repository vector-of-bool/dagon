[project]
name = "dagon"
version = "0.0.0-alpha.1"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "vector-of-bool", email = "vectorofbool@gmail.com" }]
requires-python = ">=3.12"
dependencies = []
classifiers = ["Development Status :: 1 - Planning"]

[tool.uv.build-backend]
namespace = true
source-exclude = ["**/*_test.py"]

[[tool.uv.index]]
name = "test-pypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[project.scripts]
dagon = "dagon.cli.main:start"

[build-system]
requires = ["uv_build>=0.8.14,<0.9.0"]
build-backend = "uv_build"


[dependency-groups]
dev = [
    "pyright>=1.1.405",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.12.12",
]
docs = [
    "sphinx>=8.2.3",
    "sphinx-autobuild>=2025.8.25",
    "sphinx-book-theme>=1.1.4",
]

[tool.pyright]
include = ["src/"]
strict = ["**"]
pythonversion = "3.13"

[tool.ruff]
line-length = 120
